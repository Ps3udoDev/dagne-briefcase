<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Psicoiris Isotipo">
  <defs>
    <linearGradient id="bgGrad" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4E6E5"/>
      <stop offset="100%" stop-color="#E8D3EC"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="156" y1="120" x2="356" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9F73AB"/>
      <stop offset="100%" stop-color="#D4B2D8"/>
    </linearGradient>
  </defs>

  <!-- Base orgánica redondeada (santuario) -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="#D4B2D8" stroke-width="8"/>

  <!-- Halo exterior de iris en lavanda suave -->
  <circle cx="256" cy="256" r="144" fill="#FFFFFF" fill-opacity="0.72" stroke="#E8D3EC" stroke-width="6"/>

  <!-- Pétalos / arcos concéntricos (iris + calma) -->
  <path d="M148 318C148 216 196 152 256 152C316 152 364 216 364 318" stroke="#D4B2D8" stroke-width="18" stroke-linecap="round"/>
  <path d="M184 326C184 244 216 192 256 192C296 192 328 244 328 326" stroke="url(#archGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Núcleo / Pupila editorial + brote de equilibrio -->
  <circle cx="256" cy="264" r="36" fill="#9F73AB"/>
  <circle cx="256" cy="264" r="14" fill="#FFFFFF"/>

  <!-- Línea de horizonte sereno -->
  <path d="M168 344H344" stroke="#9F73AB" stroke-width="12" stroke-linecap="round" stroke-opacity="0.65"/>
</svg>
